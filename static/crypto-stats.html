<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <style>
        body {
            background: #000000;
            color: #ffffff;
        }

        table {
            text-align: right;
        }

        table td {
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <form class="form-dates">
                    <div style="float:left;margin-left:30px">
                        <p>Start date (format: 2021-10-01)</p>
                        <input class="start-date" type="text" value="2021-10-01" />
                    </div>
                    <div style="float:left;margin-left:30px">
                        <p>End date (format: 2021-10-31)</p>
                        <input class="end-date" type="text" value="2021-10-31" />
                    </div>
                    <div style="float:left;margin-left:30px;margin-top:30px">
                        <button type="submit">Submit</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <h3>Market cap desc (today)</h3>
                <ul class="coin-container"></ul>
                <h3>Total vol desc (time-frame)</h3>
                <table class="total-volume"></table>
            </div>
            <div class="col-md-6">
                <h3>Total vol from left (time-frame)</h3>
                <ul class="coin-container2"></ul>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
